# 7 1/2 Men — league configuration.
# Everything the engine needs lives here; nothing is hardcoded in the modules.

league:
  id: "1388606375239643136"
  name: "7 1/2 Men"
  season: 2026
  first_season: 2026          # no keepers exist before this
  teams: 8
  playoff_teams: 4
  playoff_week_start: 14
  # Sleeper is the thing the league actually plays on, and it is set to a
  # week-14 start at TWO WEEKS PER ROUND: semis 14-15, final 16-17. So the
  # regular season is 13 weeks, not 14, and the Chase runs the full four
  # weeks alongside the winners bracket rather than three. Voted to follow
  # Sleeper rather than re-cut the schedule around a 14-week season.
  regular_season_weeks: 13
  playoff_weeks_per_round: 2
  chase_weeks: [14, 15, 16, 17]   # consolation bracket, runs alongside
  # Every team also plays the LEAGUE MEDIAN each week, so there are two
  # results a week: your head-to-head, and you against the middle of the
  # league. It was switched on in Sleeper from the start and never written
  # down, which made the standings on this site disagree with the standings
  # in the app. Written down now. It cuts schedule luck hard - a good team
  # that runs into the week's high scorer still banks a win against the
  # median.
  median_match: true

drafts:
  # PASSED 2026-08-30, effective 2027: ONE draft, not two.
  #
  # Sixteen rounds, every player on one board, and nobody is required to take
  # a rookie. That is the point of it - right now two rookies arrive free
  # because they come off a board that costs no veteran capital, and on one
  # board they cost a real pick. A rookie stops being an entitlement and
  # starts being a decision.
  #
  # Nothing here changes 2026. The two drafts below already happened.
  consolidated_from: 2027
  consolidated_rounds: 16
  # From 2027 a rookie kept on the NORMAL keeper path costs the round you
  # actually drafted him in, because now he has one. Take him in the 12th and
  # he keeps at R12. The R5 premium below survives only as a legacy price for
  # the sixteen players taken in the 2026 rookie draft, then retires itself.
  # ROOKIE-DESIGNATED keepers are untouched: two slots, your last rounds, no
  # clock, exactly as written.
  rookie_premium_legacy_only_from: 2027

  # WHICH Sleeper drafts are the real ones, in board order.
  #
  # Five drafts exist on Sleeper and only three of them count. Two are junk:
  # 1388606375256420352 is the original 14-round veteran board, never started,
  # and 1388608052063657984 is the rookie draft that went live configured for
  # 16 ROUNDS rather than 16 picks and was abandoned. Autodetecting by
  # player_type picked whichever was created last, which is how the site came
  # to describe the veteran draft as four rounds.
  #
  # The veteran draft is genuinely TWO drafts: Sleeper caps a board at the
  # rounds it was created with, so rounds 1-10 ran on one and 11-14 on a
  # second with the same seat order. They are listed in board order and read
  # as one 14-round draft.
  sleeper_drafts:
    veteran:
      - "1393111328339562496"   # rounds 1-10
      - "1399627678364999680"   # rounds 11-14
    rookie:
      - "1391297052188626944"   # 2 rounds

  veteran_rounds: 14
  # 14, not 13. The two rookie-draft picks go to the TAXI squad before the
  # veteran draft, and taxi does not count against the 14 active spots - so the
  # board starts empty and 14 rounds fills it exactly. Sleeper is already set to
  # 14, so this also stops the app and the league disagreeing about the number.
  #
  # It does cost the forced promote-or-stash choice 13 was built around: with
  # both rookies parked by rule, promoting one puts you 15 deep on a 14-man
  # roster. The choice survives, it just has a price now - cut your 14th-round
  # pick - which is a fairer place to put it than a round count nobody can see.
  veteran_rounds_first_season: 14
  rookie_rounds: 2
  snake: true
  # Does the rookie draft snake too, or does round 2 repeat round 1? The written
  # rules only ever said "2 rounds, 16 picks" and never settled it. Snake here
  # for consistency with the veteran draft; flip to false for a linear board.
  rookie_snake: true

  # The veteran board, seat by seat, as the managers chose it off the drum.
  # This app is the record for the veteran draft, so the order has to live here
  # rather than being read off Sleeper - Sleeper's veteran draft still has no
  # order set on it, and the app was falling back to config order, which is how
  # a board came out showing the wrong eight names.
  veteran_slots:
    - "980569987930804224"    # 1  Lucas Hamilton
    - "964703051971887104"    # 2  Brandon Clifton
    - "334162589502144512"    # 3  Josh Lavanchy
    - "979382824706912256"    # 4  Corey McKinney
    - "1001531274030305280"   # 5  Clayton Hamilton
    - "979455520442580992"    # 6  Thad Harter
    - "1254567796231114752"   # 7  Devin Clifton
    - "979400432114102272"    # 8  Isiah Douglass

roster:
  starters: [QB, RB, RB, WR, WR, TE, FLEX, FLEX, FLEX]
  flex_positions: [RB, WR, TE]
  bench: 5
  ir: 1

# Settled by league vote. Recorded here so the rulebook renders the ANSWER
# rather than the question, and so nobody has to scroll a group chat in March.
# 7 of 8 voted; Devin did not. The first three were already mathematically
# decided without him. The buy-in was 4-3 and was called at flat $100.
settled:
  date: "2026-08-30"
  turnout: "7 of 8 (Devin did not vote)"
  votes:
    deadline:
      answer: "Week 12"
      tally: "4-2-1 (wk12 / wk13 / wk10)"
      note: "Two weeks of regular season left, so a deal still has to be made by
             someone who is in it. Sleeper enforces this one - it was set to
             week 11 and has been moved."
    vetoes:
      answer: "League vote, 5 of 8 within 24 hours"
      tally: "4-2-1 (league vote / no vetoes / commish review)"
      note: "Sleeper was set to need SIX votes. Moved to five."
    waivers:
      answer: "Leave Sleeper's rolling order alone"
      tally: "7-0-0, unanimous"
      note: "Self-correcting over a season, and it quietly compensates whoever
             drew the back of the draft. No Sleeper change needed."
    escalation:
      answer: "Flat $100 forever"
      tally: "4-3 (flat / +$10 a year)"
      note: "Called at flat. The pot cap is the third-place prize, so it moves
             on its own if the buy-in is ever revisited."

rules:
  keepers:
    total: 5
    regular: 3
    rookie: 2
    max_years: 3              # a 4th year needs the franchise tag
    year2_bump: 3             # year 2 costs your draft round minus 3
    # A player who entered through the ROOKIE draft has no veteran draft round to
    # price against. This is the stand-in, and in year one it is FLAT - no ADP
    # option, no cheaper-of choice. From year two the normal ladder resumes with
    # this as the anchor (5 -> 2 -> ADP). Most likely number to get tuned after a
    # season, which is why it lives here.
    rookie_draft_premium_round: 5
    adp_discount: true        # years 1 and 2 may take ADP instead if it is cheaper
    position_caps: {}         # none in this league
    enforce_owned_picks: true
    owned_pick_mode: bump     # move to the next-EARLIEST round you still own
    price_travels_on_trade: true

  rookie_keepers:
    cost: last_rounds         # your last pick, then the one before it (R14, R13)
    eligible_sources: [rookie_draft, veteran_draft]   # any NFL rookie you DRAFTED
    exclude_sources: [waiver, free_agent, trade]
    clock: none               # no 3-year wall
    trade_converts_to: original_round   # traded -> regular keeper at his original
                                        # draft round, three-year clock restarts at 1

  franchise:
    slots: 1
    extra_years: 2            # years 4 and 5
    price: peak               # frozen at the most EXPENSIVE (earliest) round ever paid
    final_year: 6             # gone after year 5, no exceptions
    locked_at_submission: true

  taxi:
    slots: 2
    years: 2
    # ANY rookie you DRAFTED this year, from either board - not just the two
    # off the rookie draft. A rookie taken in the 12th of the veteran draft is
    # as taxi-eligible as one taken 1.01 in the rookie draft; what qualifies
    # him is that he is a rookie and you drafted him, not which board he came
    # off. This already matched `rookie_keepers.eligible_sources` below, which
    # has always read "any NFL rookie you DRAFTED" - the two were in conflict.
    #
    # From 2027 there is only one draft, so this stops needing to be said.
    source: any_drafted_rookie
    eligible_sources: [rookie_draft, veteran_draft]
    exclude_sources: [waiver, free_agent, trade]
    startable: false
    counts_against_bench: false
    counts_against_keepers: false
    promotion: permanent
    # Promoting off taxi does NOT cost the rookie-keeper designation. He was an
    # NFL rookie you drafted and you never stopped holding him, so the chain is
    # unbroken - he just moves from costing nothing to costing a ROOKIE keeper
    # slot at the last-round price, with no three-year clock.
    #   any_year          promotion is free of the designation whenever it happens
    #   second_year_only  only a year-2 promotion keeps it (the stricter reading)
    promotion_keeps_rookie_status: any_year
    in_season_adds: false
    # Taxi squads are DECLARED, and the declaration closes when the first game
    # of week one kicks off. Not week 4, not the trade deadline - kickoff.
    #
    # This is the rule Sleeper currently disagrees with: its `taxi_deadline` is
    # set to week 4, which would let somebody watch a rookie for three weeks
    # and then park him once he was safe. The whole point of the slot is that
    # you commit to a player before you know anything.
    #
    # A slot left empty at kickoff stays empty for the season. It is not
    # returned and it cannot be filled later.
    #
    # The lock is BOTH WAYS. Whoever is on taxi when the first game starts is
    # your taxi squad for the season - you cannot swap a rookie out for a
    # different one, and you cannot shuttle a player in and out week to week
    # to dodge a bye. The only way off taxi is to PROMOTE him, which is
    # permanent (see `promotion` below) and costs you a roster spot.
    declare_by: first_kickoff
    locked_both_ways: true
    sleeper_taxi_deadline_should_be: 0
    # Year one only: both rookie-draft picks are parked on taxi BEFORE the
    # veteran draft, not after. Taxi does not count against the 14 active
    # spots, so the board starts empty and 14 rounds fills it exactly. Do it
    # afterwards and every team is 16 deep on a 14-man roster mid-draft.
    auto_stash_before_veteran_draft: true
    tradeable: true           # stays on taxi for the new team if they have a slot

  faab:
    budget: 100
    # The cap is the THIRD-PLACE PRIZE, not a fixed number - voted 2026-08-06.
    # Deriving it means it can never drift above a playoff finish, at any buy-in:
    # at a flat $200 a bubble team in week 14 was close to indifferent between
    # sneaking into the bracket and missing on purpose to play for the pot, which
    # is a tanking incentive written into the foundation. Set `payouts.buy_in`
    # and this computes itself. A plain number still works if you want one.
    pot_cap: third_place      # third_place | <a number>
    pot_cap_fallback: 200     # used only while buy_in is unset
    pot_to: chase_winner      # first $cap
    # Overflow rejoins the prize pool rather than landing entirely on the
    # champion, so a low-spend year lifts the whole bracket. The Chase winner
    # takes a slice of it too, which lands somewhere neat: their total becomes
    # the cap plus 10% of overflow, and third place is the third-place prize
    # plus 10% of overflow. The two come out EQUAL at every pot size. The
    # consolation ties a playoff finish and never beats one.
    overflow_to: bracket      # bracket | champion
    overflow_split:           # percent of whatever sits above the cap
      first: 60
      second: 20
      third: 10
      chase: 10
    # Dropping a player does not launder his keeper price. There is no re-add
    # lockout - anyone can claim anyone - but he carries whatever round and
    # clock he already had, so a cut-and-re-add cannot reset him to a last-round
    # pick. Only a player who has NEVER been drafted in this league prices off
    # your last available round.
    price_survives_a_drop: true

  lottery:
    # Two drums, same shape, different basis.
    rookie_basis: record      # regular-season record, worst first
    veteran_basis: final      # final standing incl. the Chase bracket, worst first
    weights: [24, 21, 18, 15, 10, 7, 3, 2]
    weights_alt: [30, 22, 16, 12, 8, 6, 4, 2]   # the steeper spread, kept for comparison
    champion_floor: true      # champion always takes the smallest weight
    lottery_slots: 2          # how many selections the drum actually draws;
                              # everyone after that falls in ball-weight order
    # The repeat lock-out is PER DRUM and covers first choice only. Win first
    # choice of the rookie draft and you cannot win it again next year - but you
    # are still free to win first choice of the veteran draft, and vice versa.
    no_repeat_top: 1
    lockout_scope: per_drum   # per_drum | both_drums
    no_sweep: true            # nobody wins first choice in both drums the SAME year
    selection_order: true     # the drum picks an order, not a slot
    randomize_first_season: true

