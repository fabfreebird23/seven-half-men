# Prize money. buy_in is the one number the meeting still has to settle; until
# it is set the pot falls back to rules.faab.pot_cap_fallback and every prize
# reads as unknown rather than as zero.
payouts:
  buy_in: 100               # dollars per team. Voted FLAT FOREVER on 2026-08-30
  escalation: none          # 4-3 over +$10 a year. See `settled` above.
  split:                    # percent of the pool, must total 100
    first: 60
    second: 25
    third: 15
  # $1 of unspent FAAB = this many real dollars. 1.0 is what the engine assumed
  # before anyone asked the question out loud. If you set this below 1 the cap
  # will rarely bind and the Chase winner simply takes whatever is in the pot -
  # a legitimate choice, but then the cap is doing no work.
  faab_to_dollars: 1.0

me: "964703051971887104"   # whose team the "my" views default to

draw:
